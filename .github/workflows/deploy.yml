name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" button

# Never run two deploys at the same time; queue them instead
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Minimal token permissions
permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # tests/helpers/test-db.mjs and test-server.mjs open a real MySQL
    # connection (and throw immediately if DB_USER isn't set) — every
    # test:unit file that touches the DB and all of test:api need this.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: urban_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: urban_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Package release
        run: |
          tar --exclude=./node_modules \
              --exclude=./.git \
              --exclude=./.github \
              --exclude=./.env \
              -czf "$RUNNER_TEMP/release.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production # secrets live here; can require manual approval
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH (strict host key checking)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release
        run: |
          ssh prod 'mkdir -p ~/deploy/incoming'
          scp release.tar.gz "prod:deploy/incoming/${{ github.sha }}.tar.gz"

      - name: Run deploy script on server
        run: ssh prod 'bash -s' -- "${{ github.sha }}" < scripts/deploy-remote.sh

      - name: Remove SSH key
        if: always()
        run: rm -rf ~/.ssh
